[project]
name = "stream-ad-monitor"
version = "0.4.0"
description = "Monitors a Twitch stream, toggles Reddit Ads and TrafficStars campaigns, and announces the stream on X, Bluesky, and Mastodon."
authors = [{ name = "holden", email = "holden@pigscanfly.ca" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "requests-oauthlib>=1.3.1",
    "selenium>=4.18.0",
]

[project.scripts]
stream-ad-monitor = "run:main"

[tool.poetry]
packages = [{ include = "stream_ad_monitor" }, { include = "run.py" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<8.4.0"
pytest-mock = ">=3.12.0"
responses = ">=0.25.0"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
