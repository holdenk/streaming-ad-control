# rules.example.yaml
#
# Copy this file to rules.yaml (or any path) and set RULES_FILE to point to it.
# Each rule maps one or more title keywords to one or more Reddit campaign IDs.
# Keyword matching is case-insensitive.
#
# Find your campaign IDs in the URL bar of the ads.reddit.com dashboard when
# viewing a campaign — the long numeric ID after /campaigns/ is what you want.
#
# Usage:
#   export RULES_FILE=/path/to/rules.yaml
#   python run.py

rules:
  - name: "Spark streams"
    keywords:
      - Spark
    campaign_ids:
      - "2470329120103230906"

  - name: "Home Assistant streams"
    keywords:
      - "home assistant"
      - homeassistant
    campaign_ids:
      - "2470329120103231000"
      - "2470329120103231001"

  - name: "Python streams"
    keywords:
      - Python
      - PyData
    campaign_ids:
      - "2470329120103231002"
