# rules.example.yaml
#
# Copy this file to rules.yaml (or any path) and set RULES_FILE to point to it.
# (Or run `python scripts/setup.py`, which writes it for you.)
#
# One rule per stream topic: title keywords → the campaigns to run while that
# topic is live. Matching is case-insensitive on WHOLE WORDS — "Spark" matches
# "Apache Spark" and "#Spark" but not "sparkle" or "SparkSQL". Set
# `match: substring` on a rule for the old any-occurrence behaviour.
# `exclude_keywords` veto a rule. A campaign listed under several rules runs
# while any of them matches.
#
# Campaign ID keys (any combination per rule):
#   campaign_ids               Reddit Ads — the long number after /campaigns/
#                              in the ads.reddit.com URL. (alias:
#                              reddit_campaign_ids)
#   trafficstars_campaign_ids  TrafficStars — numeric, from the campaign list.
#                              Needs TRAFFICSTARS_API_KEY.
#   exoclick_campaign_ids      ExoClick — numeric. Needs EXOCLICK_API_TOKEN.
#   propellerads_campaign_ids  PropellerAds — numeric. Needs
#                              PROPELLERADS_API_TOKEN.
#   meta_campaign_ids          Meta (Facebook/Instagram) — the Campaign ID
#                              column in Ads Manager. Needs META_ACCESS_TOKEN.
#
# Usage:
#   export RULES_FILE=/path/to/rules.yaml
#   python run.py

rules:
  - name: "FHI"
    keywords:
      - FHI
      - "Fight Health Insurance"
    exclude_keywords:
      - Spark                    # a title naming both topics runs neither
    campaign_ids:                # Reddit
      - "2470329120103230906"
    meta_campaign_ids:           # Meta
      - "120200000000000001"

  - name: "Spark dev"
    keywords:
      - Spark
      - PySpark
      - SparkSQL
    exclude_keywords:
      - FHI
    campaign_ids:
      - "2470329120103231000"
    trafficstars_campaign_ids:
      - "123456"
    propellerads_campaign_ids:
      - "654321"

  - name: "Home Assistant (ExoClick only)"
    keywords:
      - "home assistant"
      - homeassistant
    exoclick_campaign_ids:
      - "777777"
